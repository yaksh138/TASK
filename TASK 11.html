<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;

        }
        
        .container{
            
            display:grid;
            gap:15px;
            grid-template-columns: repeat(4,1fr);
            grid-template-rows: repeat(3,150px);
            margin:15px;
            background-color: chocolate;
        }
        .child1{
            background-color:blanchedalmond;
            grid-row-start:1;
            grid-row-end:4;
        }
        .child2{
            background-color:aqua;
            grid-column-start:2;
            grid-column-end:4;
        }
        .child3{
            background-color:blueviolet;
        }
        .child4{
            background-color:black;
        }
        .child5{
            background-color:aquamarine;
        }
        .child6{
            background-color:burlywood;
            grid-row-start:2;
            grid-row-end:4;
            grid-column-start: 4;
            grid-column-end:5;

            
        }
        .child7{
            background-color:chartreuse;
        }
        .child8{
            background-color:darkgreen;
        }
        /* new div */
        .container1{
            display:grid;
            gap:15px;
            grid-template-columns:repeat(5,1fr);
            grid-template-rows:repeat(4,100px);
            margin:15px;
            margin-top:50px;
            background-color: darkmagenta;
            padding: 15px;
            
        }
        .child9{
            background-color:rgb(226, 43, 43);
            grid-row-start:1;
            grid-row-end:3;
        }
        .child10{
            background-color:blue;
            grid-column-start:2;
            grid-column-end:4;
        }
        .child11{
            background-color:orange;
            grid-column-start:4;
            grid-column-end:6;
        }
        .child12{
            background-color:purple;
            grid-row-start:2;
            grid-row-end:4;
        }
        .child13{
            background-color:brown;
            grid-column-start:3;
            grid-column-end:5;
            grid-row-start:2;
            grid-row-end:4;
        }
        .child14{
            background-color:black;
            grid-row-start:2;
            grid-row-end:5;
            grid-column-start:5;
            grid-column-end:6;
        }
        .child15{
            background-color:yellow;
            grid-row-start:3;
            grid-row-end:5;
        }
        .child16{
            background-color:rebeccapurple;
             grid-column-start:2;
            grid-column-end:4;

        }
        .child17{
            background-color:greenyellow;
        }
        .country{
            display:grid;
            grid-template-columns:repeat(4,1fr);
            grid-template-rows:repeat(2,150px);
            gap:15px;
            margin:15px;
            position:relative;
        

        }
        .image1{ 
            grid-area:1/1/3/2;
            background-image: url("https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTWPvxhjBJxgJoHZwdruIi5o-fQxOq_thO8zQi0K3Ww6g&s=10");
            border-radius: 8px;
            overflow:hidden;
            background-size: cover;
            background-position:center;

        }
        .image2{
            grid-area:1/2/2/4;
            background-color: aquamarine;
             border-radius: 8px;
            overflow:hidden;


        }
        .image3{
           border-radius: 8px;
            overflow:hidden;
             



        }
        .image4{
             border-radius: 8px;
            overflow:hidden;


        }
        .image5{
            border-radius: 8px;
            overflow:hidden;


        }
        .image6{

            border-radius: 8px;
            overflow:hidden;

        }
        .rating{
            background-color: orangered;
            border-radius: 50px;
            text-align: center;
            width:50px;
           transform:translate(1px,-100px)
              /*margin:15px;*/
        }
        
    </style>
</head>
<body>
    
    <div class="container">
        <div class="child1">1</div>
        <div class="child2">2</div>
        <div class="child3">3</div>
        <div class="child4">4</div>
        <div class="child5">5</div>
        <div class="child6">6</div>
        <div class="child7">7</div>
        <div class="child8">8</div>
    </div>
    <div class="container1">
        <div class="child9">1</div>
        <div class="child10">2</div>
        <div class="child11">3</div>
        <div class="child12">4</div>
        <div class="child13">5</div>
        <div class="child14">6</div>
        <div class="child15">7</div>
        <div class="child16">8</div>
        <div class="child17">9</div>

    </div>
   <div class="country">
    <div class="image1"><p class="rating">4.5</p></div>
    <div class="image2"><p class="rating">4.5</p></div>
    <div class="image3"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTgv159f78MPKQ8zaTuWWZhy139l_ArS4dIOHEbz8xNkQ&s=10"width="100%"height="160px"><p class="rating">4.5</p></div>
    <div class="image4"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRyPXkHR1neP7LgG5H7-q9PTRbrT6WPqyYKsXHFcK9BgQ&s=10"width="100%"height="160px"><p class="rating">4.5</p></div>
    <div class="image5"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS6Na8YNzT8NANCfBVcUzo0ixnUffU_OgloKUgmFUDQGw&s=10"width="100%"height="160px"><p class="rating">4.5</p></div>
    <div class="image6"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTn_yuzwHj8m-ez4dzXei0ZF0TDscSKzpykc3k5Qi0Z6w&s=10"width="100%"height="160px"><p class="rating">4.5</p></div>
    <p class="rating">4.5</p>
   </div>
</body>
</html>
