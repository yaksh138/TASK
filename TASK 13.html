<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing:border-box;
        }
        .main{ 
            height:400px;
            width:85%;
            border:2px solid silver;
            margin-top: 20px;
            display:flex;
            flex-direction: column;
            box-shadow: 0px 0px 10px black;
            border-radius: 10px;
            overflow: hidden;
            margin:auto;
            margin-bottom: 50px;
            margin-top:90px;
        }
        .m1{
            flex:1;
            background-color: blue;
            display:flex;
            justify-content:center;
            align-items: end;
            position:relative;
        }
         .m2{
            background-color: white;
            flex:1;
        }
        .v {
             width: 50%;
             height: 200px;
             border: 2px solid black;
             position: absolute;
            bottom: -50%;
             overflow: hidden;
        }


        .v iframe {
          width: 100%;
          height: 100%;
          object-fit: contain;
          display: block;
        }

    
        
    </style>
</head>
<body>
    <div class="main">
        <div class="m1">
           <div class="v">
             <iframe
        src="https://slast430did.com/play/tt33094114"
        allowfullscreen>
    </iframe>
</div>
        </div> 
        <div class="m2"></div> 
 
    </div> 
</body>
